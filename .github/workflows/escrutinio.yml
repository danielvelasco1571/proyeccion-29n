name: Escrutinio 29-N
on:
  schedule:
    - cron: '*/5 19-23 29 11 *'   # 29-N de 20:00 a 00:55 (hora peninsular) cada 5 minutos
    - cron: '*/10 0-3 30 11 *'    # madrugada del 30-N cada 10 minutos
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: escrutinio
jobs:
  escrutinio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/escrutinio.py
      - name: Guardar cambios
        run: |
          if ! git diff --quiet escrutinio.json; then
            git config user.name "actualizador-29N"
            git config user.email "actions@users.noreply.github.com"
            git add escrutinio.json
            git commit -m "Escrutinio $(date -u +%H:%M)"
            git pull --rebase && git push
          fi
